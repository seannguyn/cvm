name: deploy
# Tenant repo workflow. Builds this repo's image and calls the shared unikube workflow.
# If the image is compliant (built on container-soe.registry.domain/*), unikube NOTATION-
# signs it and pushes — Wiz's shared NOTARY validator then admits it fleet-wide (no PR).
# If not compliant, unikube checks for a merged exemption on each target cluster; if none,
# the run FAILS and you raise a manual exemption PR in container-vulnerability-exemption.

on:
  push:
    branches: [main]
    paths: ["Dockerfile", ".github/workflows/deploy.yaml"]
  workflow_dispatch:

jobs:
  admit:
    uses: org/container-vulnerability-exemption/.github/workflows/unikube.yaml@main
    with:
      image: ecr/tenant_Y_image
      tag: "1.0.0"
      target_clusters: '["nonprod/wizn02", "prod/fsp02"]'
      push_auth: oidc                 # or "secrets"
    secrets:
      WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
      WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
      EXEMPTION_REPO_TOKEN: ${{ secrets.EXEMPTION_REPO_TOKEN }}   # clone the interface repo (stubbed)
      NOTATION_KEY: ${{ secrets.NOTATION_KEY }}                   # signing key (stubbed)
      NOTATION_CERT: ${{ secrets.NOTATION_CERT }}                 # CA-issued signing cert (stubbed)
