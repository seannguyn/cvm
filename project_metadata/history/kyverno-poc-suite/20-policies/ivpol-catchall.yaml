# Fail-closed backstop (test 5.5).
#
# WHY THIS EXISTS: soe-notary-signed only matches the SOE registry glob. Every other image --
# vendor, OSS, a typo'd registry host, an image pulled from a mirror nobody registered -- is
# SKIPPED, and on v1.18.2 skipped means admitted, silently, because
# validationConfigurations.required is not read by anything (F3).
#
# This policy matches EVERYTHING and denies by default. Vendor and non-compliant self-built
# images are then admitted one at a time by PolicyException, which is the ADR's model: one
# exemption mechanism, security-approved, with an expiry.
#
# On v1.19 you can express the same thing with `required: true` on the SOE policy alone and
# drop this file -- test both and record which you'd ship.
---
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: deny-unverified-images
  annotations:
    policies.kyverno.io/description: >-
      Catch-all backstop. Any image not covered by a verifying policy and not covered by an
      approved PolicyException is denied. Test material.
spec:
  validationActions:
    - Audit
  failurePolicy: Ignore
  webhookConfiguration:
    timeoutSeconds: 15
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false

  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]

  # Everything. Note this policy must NOT re-verify SOE images -- see matchConditions below,
  # which excludes them so the two policies do not double up on registry calls.
  matchImageReferences:
    - glob: "**"

  matchConditions:
    # Skip pods whose images are ALL from the SOE registry -- soe-notary-signed already covers
    # those, and without this both policies would fetch the same signature from the registry.
    #
    # `spec.?initContainers.orValue([])` is Kyverno's own idiom for optional container lists
    # (pkg/cel/compiler/images.go uses exactly this), so it is known to compile in this
    # environment. Two separate .all() calls rather than concatenating the lists: list
    # concatenation on dyn-typed fields is the kind of thing that type-checks here and
    # surprises you on another version.
    - name: not-all-soe-registry
      expression: >-
        !(object.spec.containers.all(c, c.image.startsWith('container-soe.registry.domain/')) &&
          object.spec.?initContainers.orValue([]).all(c, c.image.startsWith('container-soe.registry.domain/')))

  # An attestor is a required field even when nothing will ever verify against it. Reuse the
  # same root; the point of this policy is that the expression is unconditionally false.
  attestors:
    - name: notary
      notary:
        certs:
          value: |
            -----BEGIN CERTIFICATE-----
            REPLACE_WITH_ROOT_CA_PEM
            -----END CERTIFICATE-----

  validations:
    - expression: "false"
      message: >-
        Image is not from the SOE registry and has no approved exemption. Vendor, OSS and
        non-compliant self-built images require a security-approved PolicyException with a
        ticket, an approver and an expiry.

  validationConfigurations:
    # No digest mutation here -- this policy never admits anything on its own, so pinning
    # would be wasted work and an extra webhook. Also keeps P2b's comparison clean.
    mutateDigest: false
    verifyDigest: false
    required: false
