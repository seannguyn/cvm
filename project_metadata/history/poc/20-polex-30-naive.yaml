---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: allow-app-30
  namespace: kyverno-exceptions
  # v1.18.2 has NO spec.expiresAt and NO spec.properties -- provenance goes in annotations,
  # which are a local convention rather than part of the API. See the note below.
  annotations:
    exemption.unikube.io/reason: "Demo image 3.0 accepted unsigned for the walkthrough"
    exemption.unikube.io/ticket: "SEC-0000"
    exemption.unikube.io/approved-by: "security-team"
    exemption.unikube.io/expires: "2026-11-18"
spec:
  policyRefs:
    - name: soe-notary-signed-simple
      kind: ImageValidatingPolicy

  matchConditions:
    # NOTE: spec.images and spec.allowedValues exist on the CRD and are INERT for
    # ImageValidatingPolicy -- exceptions.allowedImages is registered for vpol/mpol/gpol only.
    # The image match has to be written here, by hand.
    - name: app-30
      expression: >-
        object.spec.containers.exists(c, c.image == '891377217246.dkr.ecr.ap-southeast-2.amazonaws.com/soe-demo/app:3.0')

  reportResult: skip
